name: pingmycar_mobile
description: PingMyCar owner app — manage vehicles, QR stickers, and visitor messages.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0

  # Auth & device identity
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0

  # Firebase Cloud Messaging (owner push notifications)
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # UI / utilities
  intl: ^0.20.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  webview_flutter: ^4.10.0
  flutter_html: ^3.0.0-beta.2
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
