packages:
  - "."

# Skip pnpm's pre-run dependency verification — it intermittently crashes on this machine.
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "sharp"
  - "@tailwindcss/oxide"

allowBuilds:
  '@firebase/util': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: set this to true or false
